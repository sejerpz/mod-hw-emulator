# The standalone packages of mod-hw-emulator with MOD Desktop (scripts/package-*.sh), built as mod-desktop's own
# CI builds MOD Desktop. Run by hand (Actions > release > Run workflow) or by pushing a tag v*, which also
# attaches the packages to a draft release of that tag.
#
# The PawPaw dependencies of MOD Desktop take a while: like mod-desktop's CI, a run without them in the cache
# only builds and caches them, and MOD Desktop and the package are built by the next run.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # mod-desktop main the packages are built from (0.14-2)
  MOD_DESKTOP_REF: 9367cbcf803376aa4c72a97ad6f65f4c8126336b
  CACHE_VERSION: 1
  DEBIAN_FRONTEND: noninteractive
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_LTO: 1
  # the library tests: libFLAC's fails when run as root, as in the container
  PAWPAW_SKIP_TESTS: 1
  # no client id for the Tone3000 integration: not an official MOD Audio build
  MOD_TONE3000_CLIENT_ID: local-dev-build

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # not ubuntu-latest (26.04): wine does not start in the container there (socket: Function not implemented)
          - target: linux-x86_64
            os: ubuntu-24.04
            container: ubuntu:22.04
            make: ''
            pack: package-linux.sh
            out: mod-hw-emulator-desktop-linux-x86_64.tar.xz
          - target: win64
            os: ubuntu-24.04
            container: ubuntu:22.04
            make: win64
            pack: package-win64.sh --standalone
            out: mod-hw-emulator-desktop-win64.zip
          # universal (Intel and Apple Silicon), as mod-desktop's releases; not signed with a Developer ID
          - target: macos-universal-10.15
            os: macos-14
            container: ''
            make: PAWPAW_TARGET=macos-universal-10.15
            pack: package-macos.sh
            out: mod-hw-emulator-desktop-macos.zip
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: write
    steps:
      - name: Install git
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates git openssl
      - name: Set up git
        run: |
          git config --global --add safe.directory '*'
          # the Dwarf firmware pins its protocol submodule by its SSH URL
          git config --global url."https://github.com/".insteadOf git@github.com:

      # the emulator and what it is built with, side by side as the Makefile and the package scripts expect them
      - uses: actions/checkout@v4
        with:
          path: mod-hw-emulator
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: sejerpz/mod-dwarf-controller
          ref: feature/mod-hw-emulator
          path: mod-dwarf-controller
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: sejerpz/mod-duox-controller
          ref: master
          path: mod-duox-controller
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: sejerpz/mod-host
          ref: feature/mod-hw-emulator
          path: mod-host
      - uses: actions/checkout@v4
        with:
          repository: sejerpz/mod-system-control
          ref: feature/hmi-widgets
          path: mod-system-control
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: mod-audio/mod-desktop
          ref: ${{ env.MOD_DESKTOP_REF }}
          path: mod-desktop
          fetch-depth: 0
          submodules: recursive

      - name: Set up dependencies
        if: runner.os == 'Linux'
        working-directory: mod-desktop
        run: |
          ./src/PawPaw/.github/workflows/bootstrap-deps.sh ${{ matrix.target }}
          apt-get install -yqq libfreetype-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libxrender-dev \
              p7zip-full python3 unzip wget xdg-user-dirs xvfb xz-utils zip
      - name: Set up dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: mod-desktop
        run: |
          brew uninstall --ignore-dependencies --force azure-cli aws-sam-cli php || true
          ./src/PawPaw/.github/workflows/bootstrap-deps.sh ${{ matrix.target }}
          brew install p7zip wget
      - name: Patch MOD Desktop
        working-directory: mod-desktop
        run: |
          ./utils/apply-patches.sh
          # FluidPlug's archive at the commit mod-plugin-builder pins is no longer on GitHub
          sed -i.orig '/^PLUGINS += fluidplug$/d' Makefile && rm Makefile.orig
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
          key: ${{ matrix.target }}-${{ env.MOD_DESKTOP_REF }}-v${{ env.CACHE_VERSION }}

      # the archives of the sources, kept from run to run: some sites (Launchpad, xiph) at times answer GitHub's
      # runners with a page instead of the file, so each archive is downloaded once and then comes from here
      - name: Restore the downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/PawPawBuilds/downloads
          key: downloads-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ matrix.target }}-
            downloads-

      # downloads.xiph.org drops the connections of GitHub's runners: the xiph archives come from the OSUOSL
      # mirror instead, checked, where PawPaw finds them already downloaded
      - name: Fetch the xiph archives
        run: |
          mkdir -p ~/PawPawBuilds/downloads
          cd ~/PawPawBuilds/downloads
          while read -r sum path; do
              f=$(basename "$path")
              [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "https://ftp.osuosl.org/pub/xiph/releases/$path"
              echo "$sum  $f" | shasum -a 256 -c -
          done << 'EOF'
          0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664 ogg/libogg-1.3.5.tar.gz
          0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab vorbis/libvorbis-1.3.7.tar.gz
          f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920 flac/flac-1.5.0.tar.xz
          65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1 opus/opus-1.5.2.tar.gz
          EOF
      - name: Build dependencies
        working-directory: mod-desktop
        run: |
          ./src/PawPaw/bootstrap-mod.sh ${{ matrix.target }} && ./src/PawPaw/.cleanup.sh ${{ matrix.target }}
      - name: Dependencies cached, run the workflow again
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::PawPaw's dependencies for ${{ matrix.target }} are built and will be cached at the end of this job: run the workflow again to build the package"

      # a download answered with a page is removed and tried again a little later, a few times
      - name: Build MOD Desktop
        if: steps.cache.outputs.cache-hit == 'true'
        working-directory: mod-desktop
        run: |
          for attempt in 1 2 3 4; do
              make -k ${{ matrix.make }} -j$(getconf _NPROCESSORS_ONLN) && exit 0
              bad=$(../mod-hw-emulator/scripts/ci-bad-downloads.sh ~/PawPawBuilds/downloads)
              [ -n "$bad" ] || exit 1
              echo "::warning::not archives, downloaded again: $bad"
              (cd ~/PawPawBuilds/downloads && rm -f $bad)
              sleep 60
          done
          exit 1
      - name: Pack
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          bash mod-hw-emulator/scripts/${{ matrix.pack }} mod-desktop mod-host ${{ matrix.out }}
          ls -la ${{ matrix.out }}
      # the emulator of the macOS package starts, with each firmware: a picture of each, kept with the run
      - name: Try the emulator (macOS)
        if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          t=$RUNNER_TEMP/try
          rm -rf $t && mkdir -p $t
          ditto -x -k ${{ matrix.out }} $t
          cd $t/mod-hw-emulator
          bin="MOD Desktop.app/Contents/MacOS"
          for f in "$bin/mod-hw-emulator" "$bin/mod-desktop" "$bin/jack/mod-host.so" fw-dwarf.dylib fw-duox.dylib; do
              echo "$f: $(lipo -archs "$f")"
          done
          for d in dwarf duox; do
              "$bin/mod-hw-emulator" --state $t/state-$d --screenshot $GITHUB_WORKSPACE/try-$d.png --after 6000 $PWD/fw-$d.dylib
          done
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'macOS'
        with:
          name: try-macos
          path: try-*.png
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.cache-hit == 'true'
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          compression-level: 0
      # only good archives are kept, and only when there are new ones (the key names the set)
      - name: Keep the downloads
        id: downloads
        if: always()
        run: |
          cd ~/PawPawBuilds/downloads 2> /dev/null || exit 0
          bad=$("$GITHUB_WORKSPACE"/mod-hw-emulator/scripts/ci-bad-downloads.sh .)
          [ -z "$bad" ] || rm -f $bad
          echo "set=$(ls | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always() && steps.downloads.outputs.set != ''
        continue-on-error: true
        with:
          path: ~/PawPawBuilds/downloads
          key: downloads-${{ matrix.target }}-${{ steps.downloads.outputs.set }}

      - uses: softprops/action-gh-release@v2
        if: steps.cache.outputs.cache-hit == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.out }}
