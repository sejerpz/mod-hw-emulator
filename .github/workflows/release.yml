# The standalone packages of mod-hw-emulator with MOD Desktop (scripts/package-*.sh), built as mod-desktop's own
# CI builds MOD Desktop. Run by hand (Actions > release > Run workflow) or by pushing a tag v*, which also
# attaches the packages to a draft release of that tag.
#
# Everything is built from the submodules of mod-hw-emulator in deps/, at the commits they pin: MOD Desktop
# (sejerpz/mod-desktop, with the mod-ui of mod-hw-emulator as its src/mod-ui), mod-host, mod-system-control and
# the firmwares.
#
# The PawPaw dependencies of MOD Desktop take a while: like mod-desktop's CI, a run without them in the cache
# only builds and caches them, and MOD Desktop and the package are built by the next run.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  # the mod-audio/mod-desktop commit (main, 0.14-2) deps/mod-desktop is built on: it names PawPaw's cache, so
  # change it with the PawPaw of deps/mod-desktop
  MOD_DESKTOP_REF: 9367cbcf803376aa4c72a97ad6f65f4c8126336b
  MD: mod-hw-emulator/deps/mod-desktop
  CACHE_VERSION: 1
  DEBIAN_FRONTEND: noninteractive
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_LTO: 1
  # the library tests: libFLAC's fails when run as root, as in the container
  PAWPAW_SKIP_TESTS: 1
  # configure scripts of recent autoconf pick C23 where the compiler has it (Xcode on macos-15), and older
  # sources (glib 2.22 has a field named bool) do not build as C23
  ac_cv_prog_cc_c23: 'no'
  # no client id for the Tone3000 integration: not an official MOD Audio build
  MOD_TONE3000_CLIENT_ID: local-dev-build

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # not ubuntu-latest (26.04): wine does not start in the container there (socket: Function not implemented);
          # public DNS servers: the container's own stopped resolving archive.ubuntu.com
          - target: linux-x86_64
            os: ubuntu-24.04
            container:
              image: ubuntu:22.04
              options: --dns 1.1.1.1 --dns 8.8.8.8
            make: ''
            pack: package-linux.sh
            out: mod-hw-emulator-desktop-linux-x86_64.tar.xz
          - target: win64
            os: ubuntu-24.04
            container:
              image: ubuntu:22.04
              options: --dns 1.1.1.1 --dns 8.8.8.8
            make: win64
            pack: package-win64.sh --standalone
            out: mod-hw-emulator-desktop-win64.zip
          # universal (Intel and Apple Silicon), as mod-desktop's releases; not signed with a Developer ID
          - target: macos-universal-10.15
            os: macos-15
            container: ''
            make: PAWPAW_TARGET=macos-universal-10.15
            pack: package-macos.sh
            out: mod-hw-emulator-desktop-macos.zip
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: write
    steps:
      # the runners' DNS fails at times: apt finds no packages then, so it is tried again a little later
      - name: Install git
        if: runner.os == 'Linux'
        run: |
          cat /etc/resolv.conf
          for attempt in 1 2 3 4 5; do
              apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates git openssl && exit 0
              sleep 30
          done
          exit 1
      - name: Set up git
        run: |
          git config --global --add safe.directory '*'
          # the Dwarf firmware pins its protocol submodule by its SSH URL
          git config --global url."https://github.com/".insteadOf git@github.com:

      # the emulator and everything it is built with (deps/), one commit deep: the submodules at the commits pinned
      - uses: actions/checkout@v4
        with:
          path: mod-hw-emulator
          fetch-depth: 1
          submodules: recursive
      - name: Sources
        run: git -C mod-hw-emulator submodule status --recursive

      - name: Set up dependencies
        if: runner.os == 'Linux'
        working-directory: ${{ env.MD }}
        run: |
          ./src/PawPaw/.github/workflows/bootstrap-deps.sh ${{ matrix.target }}
          apt-get install -yqq libfreetype-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libxrender-dev \
              p7zip-full python3 unzip wget xdg-user-dirs xvfb xz-utils zip
      - name: Set up dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.MD }}
        run: |
          brew uninstall --ignore-dependencies --force azure-cli aws-sam-cli php || true
          ./src/PawPaw/.github/workflows/bootstrap-deps.sh ${{ matrix.target }}
          brew install p7zip wget
      - name: Patch MOD Desktop
        working-directory: ${{ env.MD }}
        run: |
          ./utils/apply-patches.sh
          # FluidPlug's archive at the commit mod-plugin-builder pins is no longer on GitHub
          sed -i.orig '/^PLUGINS += fluidplug$/d' Makefile && rm Makefile.orig
          # zix's C++ tests do not build with the SDK of macos-15 (its Path); PawPaw disables them only before
          # macOS 10.15, and the tests are not run here anyway
          sed -i.orig 's/if \[ "${MACOS}" -eq 1 \] && \[ "${MACOS_10_15}" -eq 0 \]; then/if [ "${MACOS}" -eq 1 ]; then/' \
              src/PawPaw/bootstrap-plugins.sh && rm src/PawPaw/bootstrap-plugins.sh.orig
          grep -n 'if \[ "${MACOS}" -eq 1 \]; then' src/PawPaw/bootstrap-plugins.sh
          # mod-utilities' HardwareBypass (mod-bypass, the true bypass of MOD devices) needs ALSA: not on macOS,
          # where it is built only with MOD=1, which the plugin builder passes
          if [ "$RUNNER_OS" = macOS ]; then
              mk=src/mod-plugin-builder/plugins/package/mod-utilities/mod-utilities.mk
              sed -i.orig -e 's/ MOD=1 / /' -e 's/ mod-bypass\.lv2 / /' -e '/mod-bypass\.lv2\/\*/d' $mk && rm $mk.orig
              ! grep -n 'MOD=1\|mod-bypass' $mk
          fi
      - name: Set up cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
          key: ${{ matrix.target }}-${{ env.MOD_DESKTOP_REF }}-v${{ env.CACHE_VERSION }}

      # the archives of the sources, kept from run to run: some sites (Launchpad, xiph) at times answer GitHub's
      # runners with a page instead of the file, so each archive is downloaded once and then comes from here
      - name: Restore the downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/PawPawBuilds/downloads
          key: downloads-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            downloads-${{ matrix.target }}-
            downloads-

      # archives PawPaw cannot get from where it looks, taken from elsewhere, checked, where it finds them
      # already downloaded: downloads.xiph.org drops the connections of GitHub's runners (the OSUOSL mirror has
      # them), MOD's mirror no longer has the glib of macOS (GNOME does)
      - name: Fetch the archives PawPaw cannot
        run: |
          mkdir -p ~/PawPawBuilds/downloads
          cd ~/PawPawBuilds/downloads
          xiph=https://ftp.osuosl.org/pub/xiph/releases
          {
              echo "0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664 $xiph/ogg/libogg-1.3.5.tar.gz"
              echo "0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab $xiph/vorbis/libvorbis-1.3.7.tar.gz"
              echo "f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920 $xiph/flac/flac-1.5.0.tar.xz"
              echo "65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1 $xiph/opus/opus-1.5.2.tar.gz"
              if [ "$RUNNER_OS" = macOS ]; then
                  echo "d953e3112b4299e63e93cd6864019629743f8b4ab67139169ed0a577cb219cbc https://download.gnome.org/sources/glib/2.22/glib-2.22.5.tar.gz"
              fi
          } | while read -r sum url; do
              f=$(basename "$url")
              [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "$url"
              echo "$sum  $f" | shasum -a 256 -c -
          done
      - name: Build dependencies
        working-directory: ${{ env.MD }}
        run: |
          ./src/PawPaw/bootstrap-mod.sh ${{ matrix.target }} && ./src/PawPaw/.cleanup.sh ${{ matrix.target }}
      - name: Dependencies cached, run the workflow again
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "::notice::PawPaw's dependencies for ${{ matrix.target }} are built and will be cached at the end of this job: run the workflow again to build the package"

      # a download that failed, or was answered with a page (removed), is tried again a little later, a few times
      - name: Build MOD Desktop
        if: steps.cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.MD }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
              make -k ${{ matrix.make }} -j$(getconf _NPROCESSORS_ONLN) 2>&1 | tee make.log && exit 0
              bad=$("$GITHUB_WORKSPACE"/mod-hw-emulator/scripts/ci-bad-downloads.sh ~/PawPawBuilds/downloads)
              if [ -n "$bad" ]; then
                  echo "::warning::not archives, downloaded again: $bad"
                  (cd ~/PawPawBuilds/downloads && rm -f $bad)
              fi
              echo "::warning::attempt $attempt failed, trying again"
              sleep 60
          done
          # some third-party plugins do not build with the Xcode of macos-15 (GNU linker options and the like):
          # on macOS the package goes without them, and says which they are; elsewhere it is an error
          if [ "$RUNNER_OS" = macOS ] && [ -x build/mod-desktop.app/Contents/MacOS/mod-desktop ]; then
              grep -o 'build-plugin-stamps/[^,]*,' make.log | sed 's|.*/||; s|,$||' | sort -u > missing-plugins.txt
              echo "::warning::plugins left out on macOS: $(tr '\n' ' ' < missing-plugins.txt)"
              exit 0
          fi
          exit 1
      - name: Pack
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          # on macOS, where the emulator is the newest, a failed build shows all its errors at once
          [ "$RUNNER_OS" != macOS ] || export MAKEFLAGS=-k
          bash mod-hw-emulator/scripts/${{ matrix.pack }} $MD mod-hw-emulator/deps/mod-host ${{ matrix.out }}
          ls -la ${{ matrix.out }}
      # the emulator of the macOS package starts, with each firmware: a picture of each, kept with the run
      - name: Try the emulator (macOS)
        if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          t=$RUNNER_TEMP/try
          rm -rf $t && mkdir -p $t
          ditto -x -k ${{ matrix.out }} $t
          cd $t/mod-hw-emulator
          bin="MOD Desktop.app/Contents/MacOS"
          for f in "$bin/mod-hw-emulator" "$bin/mod-desktop" "$bin/jack/mod-host.so" fw-dwarf.dylib fw-duox.dylib; do
              echo "$f: $(lipo -archs "$f")"
          done
          for d in dwarf duox; do
              "$bin/mod-hw-emulator" --state $t/state-$d --screenshot $GITHUB_WORKSPACE/try-$d.png --after 6000 $PWD/fw-$d.dylib
          done
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.cache-hit == 'true' && runner.os == 'macOS'
        with:
          name: try-macos
          path: try-*.png
      - uses: actions/upload-artifact@v4
        if: steps.cache.outputs.cache-hit == 'true'
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          compression-level: 0
      # only good archives are kept, and only when there are new ones (the key names the set)
      - name: Keep the downloads
        id: downloads
        if: always()
        run: |
          cd ~/PawPawBuilds/downloads 2> /dev/null || exit 0
          bad=$("$GITHUB_WORKSPACE"/mod-hw-emulator/scripts/ci-bad-downloads.sh .)
          [ -z "$bad" ] || rm -f $bad
          echo "set=$(ls | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always() && steps.downloads.outputs.set != ''
        continue-on-error: true
        with:
          path: ~/PawPawBuilds/downloads
          key: downloads-${{ matrix.target }}-${{ steps.downloads.outputs.set }}

      - uses: softprops/action-gh-release@v2
        if: steps.cache.outputs.cache-hit == 'true' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.out }}
